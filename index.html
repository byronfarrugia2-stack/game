<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Task + Study Planner</title>
<style>
    body { font-family: Arial; margin: 0; padding: 0; background: #f5f5f5; }
    header { background: #4a6cf7; padding: 15px; color: white; text-align: center; }
    section { padding: 20px; }
    input, select { padding: 8px; margin: 5px; }
    button { padding: 10px 15px; background: #4a6cf7; color: white; border: none; cursor: pointer; }
    .task { background: white; padding: 10px; margin: 10px 0; border-radius: 6px; }
    .calendar-day { border: 1px solid #ccc; padding: 10px; width: 120px; height: 120px; overflow-y: auto; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .study-block { background: #fff; padding: 10px; margin: 10px 0; border-left: 4px solid #4a6cf7; }
</style>
</head>
<body>

<header>
    <h1>Student Task Manager + Study Planner</h1>
</header>

<section>
    <h2>Add Task</h2>
    <input id="title" placeholder="Task Title">
    <input id="subject" placeholder="Subject">
    <input id="due" type="date">
    <select id="priority">
        <option value="Critical">Critical</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
    </select>
    <button onclick="addTask()">Add Task</button>
</section>

<section>
    <h2>Priority List</h2>
    <div id="priorityList"></div>
</section>

<section>
    <h2>Calendar</h2>
    <div id="calendar" class="calendar"></div>
</section>

<section>
    <h2>Study Planner (Daily)</h2>
    <input id="studySubject" placeholder="Subject">
    <input id="studyTime" type="time">
    <button onclick="addStudy()">Add Study Block</button>
    <div id="studyList"></div>
</section>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
let study = JSON.parse(localStorage.getItem("study") || "[]");

function save() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
    localStorage.setItem("study", JSON.stringify(study));
}

function addTask() {
    const t = {
        title: title.value,
        subject: subject.value,
        due: due.value,
        priority: priority.value
    };
    tasks.push(t);
    save();
    renderTasks();
    renderCalendar();
}

function renderTasks() {
    const container = document.getElementById("priorityList");
    container.innerHTML = "";

    const sorted = [...tasks].sort((a,b) => {
        const order = ["Critical","High","Medium","Low"];
        return order.indexOf(a.priority) - order.indexOf(b.priority);
    });

    sorted.forEach(task => {
        const div = document.createElement("div");
        div.className = "task";
        div.innerHTML = `<strong>${task.title}</strong><br>
                         ${task.subject}<br>
                         Due: ${task.due}<br>
                         Priority: ${task.priority}`;
        container.appendChild(div);
    });
}

function renderCalendar() {
    const cal = document.getElementById("calendar");
    cal.innerHTML = "";

    for (let i = 1; i <= 30; i++) {
        const day = document.createElement("div");
        day.className = "calendar-day";
        day.innerHTML = `<strong>Day ${i}</strong><br>`;
        
        tasks.forEach(task => {
            const d = new Date(task.due).getDate();
            if (d === i) {
                day.innerHTML += `<div>${task.title}</div>`;
            }
        });

        cal.appendChild(day);
    }
}

function addStudy() {
    const block = {
        subject: studySubject.value,
        time: studyTime.value
    };
    study.push(block);
    save();
    renderStudy();
}

function renderStudy() {
    const list = document.getElementById("studyList");
    list.innerHTML = "";
    study.forEach(s => {
        const div = document.createElement("div");
        div.className = "study-block";
        div.innerHTML = `<strong>${s.subject}</strong><br>Time: ${s.time}`;
        list.appendChild(div);
    });
}

renderTasks();
renderCalendar();
renderStudy();
</script>

</body>
</html>
